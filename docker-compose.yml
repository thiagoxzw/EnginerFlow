# Ambiente local (ADR-0002, ADR-0004, ADR-0010). Uso individual.
# Todos os serviços expõem portas apenas no loopback (127.0.0.1). Nada é publicado na rede.
# Volumes persistentes: engiflow-pgdata (banco) e engiflow-data (arquivos originais).
# Nenhum script apaga volumes automaticamente; ver scripts/local/.
name: engiflow

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: engiflow
      POSTGRES_USER: engiflow
      POSTGRES_PASSWORD: ${ENGIFLOW_DB_PASSWORD:-engiflow-dev-only}
    ports:
      - "127.0.0.1:${ENGIFLOW_PG_PORT:-5432}:5432"
    volumes:
      - engiflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engiflow -d engiflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENGIFLOW_DATABASE_URL: postgresql+psycopg://engiflow:${ENGIFLOW_DB_PASSWORD:-engiflow-dev-only}@postgres:5432/engiflow
      ENGIFLOW_DATA_DIR: /app/data
      ENGIFLOW_FRONTEND_ORIGIN: http://127.0.0.1:${ENGIFLOW_WEB_PORT:-3000}
      # Local, sem HTTPS: cookie de sessão sem o atributo Secure.
      ENGIFLOW_COOKIE_SECURE: "false"
      ENGIFLOW_LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:${ENGIFLOW_API_PORT:-8000}:8000"
    volumes:
      - engiflow-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ENGIFLOW_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${ENGIFLOW_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  engiflow-pgdata:
  engiflow-data:
